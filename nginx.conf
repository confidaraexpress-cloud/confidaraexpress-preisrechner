server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # gzip: Kompression für textbasierte Ressourcen. text/html ist bei
    # aktiviertem gzip bereits nginx-seitig immer eingeschlossen (nicht erneut
    # in gzip_types auflisten). gzip_proxied any: Anfragen kommen hinter
    # Coolify/Traefik als "proxied" Requests an (Via-Header) — ohne "any"
    # würde nginx solche Antworten sonst standardmäßig NICHT komprimieren.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml
        application/manifest+json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html explizit revalidieren (kein Langzeit-/immutable-Caching wie
    # bei gehashten Assets), damit nach jedem Deployment der neue Assethash
    # geladen wird. Exakte Location, da add_header nicht automatisch aus
    # `location /` vererbt wird. Erfasst auch die SPA-Fallback- und
    # index-Direktive-Fälle: try_files/index lösen intern auf /index.html
    # auf, wodurch diese Location (exakter Match) greift. ETag/Last-Modified
    # bleiben unverändert (nginx-Standard) für 304-Revalidierung erhalten.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Browser-Icons: kurz cachen statt `immutable`. Sie tragen einen festen
    # Namen und ändern sich mit dem Branding — im generischen Assetblock
    # darunter (expires 1y + immutable) wäre ein Wechsel für wiederkehrende
    # Besucher bis zu einem Jahr unsichtbar. `immutable` unterdrückt die
    # Revalidierung ausdrücklich auch bei Strg+R; genau das ist beim Wechsel
    # der CE-Textmarke auf das echte Signet aufgefallen.
    #
    # `^~` ist hier tragend, nicht Kosmetik: nginx sucht zuerst die längste
    # passende Präfix-Location, prüft dann aber normalerweise trotzdem noch die
    # regulären Ausdrücke und lässt einen Regex-Treffer gewinnen. Mit `^~`
    # bricht nginx nach dem Präfixtreffer ab — erst dadurch greift der Block
    # `location ~* \.(…|svg|png|…)$` unten für diese Dateien nicht mehr.
    #
    # Bewusst kein `expires` in diesen Blöcken: `expires` UND
    # `add_header Cache-Control` schrieben zwei widersprüchliche
    # Cache-Control-Header in dieselbe Antwort.
    #
    # Die Dateinamen sind zusätzlich versioniert (`favicon-v2.svg`,
    # `apple-touch-icon-v1.png`). Beides zusammen ist Absicht: die Version
    # entwertet die bereits verteilten Alt-Caches sofort, die Regel hier
    # verhindert, dass beim nächsten Wechsel wieder ein Jahr gewartet wird.
    location ^~ /favicon {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }
    location ^~ /apple-touch-icon {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Sicherheitsheader ───────────────────────────────────────────────────
    # ACHTUNG, nginx-Falle: `add_header` wird NICHT vererbt, sobald ein
    # `location`-Block selbst ein `add_header` setzt — dann gelten dort
    # AUSSCHLIESSLICH die eigenen. Vier Locations unten tun genau das
    # (Cache-Control). Deshalb steht der Block über `$ce_security_headers`
    # nicht zur Verfügung (nginx kann Header nicht als Gruppe referenzieren)
    # und muss in JEDER dieser Locations wiederholt werden.
    #
    # Wer eine neue Location mit `add_header` anlegt, MUSS diesen Block
    # mitkopieren — sonst verliert genau dieser Pfad still seine Header.
    #
    #   nosniff            — ein als text/plain ausgelieferter Treffer darf
    #                        nicht als Skript interpretiert werden. Gilt für
    #                        JEDE Antwort, nicht nur für Dokumente.
    #   frame-ancestors    — Clickjacking. `X-Frame-Options` bleibt zusätzlich
    #                        stehen: ältere Browser kennen die CSP-Direktive
    #                        nicht, und beide zusammen widersprechen sich nicht.
    #   Referrer-Policy    — auf fremde Ziele geht nur noch die Herkunft, nie
    #                        der Pfad (Sendungs-/Rechnungs-IDs stehen in URLs).
    #   Permissions-Policy — die Anwendung nutzt weder Kamera noch Mikrofon,
    #                        Standort, Zahlungs- oder USB-API. Der Kartenteil
    #                        arbeitet ohne Geolokalisierung (kein
    #                        GeolocateControl, kein navigator.geolocation).
    #
    # ─── Content-Security-Policy: gemessen, nicht geschätzt ──────────────────
    # Die Richtlinie wurde gegen den ECHTEN Build in Chromium geprüft; jede
    # Direktive steht für ein belegtes Bauteil:
    #   script-src 'self'            gehashte Vite-Bündel, kein Inline-Skript
    #   style-src 'unsafe-inline'    UNVERMEIDBAR: die Oberfläche nutzt
    #                                `style={{…}}`-Attribute (React) und
    #                                maplibre-gl setzt Stile zur Laufzeit.
    #                                'self' allein bricht das Layout.
    #   font-src 'self'              beide Familien liegen lokal (kein CDN)
    #   worker-src blob:             maplibre-gl erzeugt seinen Worker aus
    #                                einer blob:-URL — gemessen, ohne die
    #                                Direktive bleibt die Karte leer
    #   frame-src blob:              die Rechnungs-PDF-Vorschau zeigt einen
    #                                Blob im <iframe> (InvoicePdfPreviewModal)
    #   img-src blob:/data:          Label-, Lieferschein- und Logo-Downloads
    #   'unsafe-eval' NICHT nötig    maplibre-gl 6 wertet Stilausdrücke ohne
    #                                eval aus — geprüft, nicht angenommen
    #
    # ACHTUNG, Kopplung an den Build: `connect-src` und `img-src` nennen zwei
    # Hosts, die als BUILD-Variablen im Bündel landen — VITE_API_URL (.env)
    # und der Kachelhost aus src/config/map.js bzw. VITE_MAP_STYLE_URL. Wer
    # einen davon ändert, MUSS ihn hier nachziehen; sonst blockiert der Browser
    # jeden API-Aufruf beziehungsweise die Karte. Die Richtlinie ist deshalb
    # bewusst kein Selbstläufer, sondern ein Deploymentvertrag.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://api.confidaraexpress.de https://tile.openstreetmap.org; worker-src 'self' blob:; frame-src blob:" always;

    # gzip: Kompression für textbasierte Ressourcen. text/html ist bei
    # aktiviertem gzip bereits nginx-seitig immer eingeschlossen (nicht erneut
    # in gzip_types auflisten). gzip_proxied any: Anfragen kommen hinter
    # Coolify/Traefik als "proxied" Requests an (Via-Header) — ohne "any"
    # würde nginx solche Antworten sonst standardmäßig NICHT komprimieren.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml
        application/manifest+json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html explizit revalidieren (kein Langzeit-/immutable-Caching wie
    # bei gehashten Assets), damit nach jedem Deployment der neue Assethash
    # geladen wird. Exakte Location, da add_header nicht automatisch aus
    # `location /` vererbt wird. Erfasst auch die SPA-Fallback- und
    # index-Direktive-Fälle: try_files/index lösen intern auf /index.html
    # auf, wodurch diese Location (exakter Match) greift. ETag/Last-Modified
    # bleiben unverändert (nginx-Standard) für 304-Revalidierung erhalten.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Wiederholung: siehe Sicherheitsheader-Block oben (keine Vererbung).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://api.confidaraexpress.de https://tile.openstreetmap.org; worker-src 'self' blob:; frame-src blob:" always;
    }

    # Browser-Icons: kurz cachen statt `immutable`. Sie tragen einen festen
    # Namen und ändern sich mit dem Branding — im generischen Assetblock
    # darunter (expires 1y + immutable) wäre ein Wechsel für wiederkehrende
    # Besucher bis zu einem Jahr unsichtbar. `immutable` unterdrückt die
    # Revalidierung ausdrücklich auch bei Strg+R; genau das ist beim Wechsel
    # der CE-Textmarke auf das echte Signet aufgefallen.
    #
    # `^~` ist hier tragend, nicht Kosmetik: nginx sucht zuerst die längste
    # passende Präfix-Location, prüft dann aber normalerweise trotzdem noch die
    # regulären Ausdrücke und lässt einen Regex-Treffer gewinnen. Mit `^~`
    # bricht nginx nach dem Präfixtreffer ab — erst dadurch greift der Block
    # `location ~* \.(…|svg|png|…)$` unten für diese Dateien nicht mehr.
    #
    # Bewusst kein `expires` in diesen Blöcken: `expires` UND
    # `add_header Cache-Control` schrieben zwei widersprüchliche
    # Cache-Control-Header in dieselbe Antwort.
    #
    # Die Dateinamen sind zusätzlich versioniert (`favicon-v2.svg`,
    # `apple-touch-icon-v1.png`). Beides zusammen ist Absicht: die Version
    # entwertet die bereits verteilten Alt-Caches sofort, die Regel hier
    # verhindert, dass beim nächsten Wechsel wieder ein Jahr gewartet wird.
    location ^~ /favicon {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        # Wiederholung: siehe Sicherheitsheader-Block oben (keine Vererbung).
        # Für ein SVG-Favicon ist `nosniff` kein Formalismus — ein SVG ist ein
        # Dokument mit möglichem aktiven Inhalt.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://api.confidaraexpress.de https://tile.openstreetmap.org; worker-src 'self' blob:; frame-src blob:" always;
    }
    location ^~ /apple-touch-icon {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        # Wiederholung: siehe Sicherheitsheader-Block oben (keine Vererbung).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://api.confidaraexpress.de https://tile.openstreetmap.org; worker-src 'self' blob:; frame-src blob:" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Wiederholung: siehe Sicherheitsheader-Block oben (keine Vererbung).
        # Hier trägt vor allem `nosniff`: dieser Block liefert die gehashten
        # JS-/CSS-Bündel UND die SVG-Assets aus.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://api.confidaraexpress.de https://tile.openstreetmap.org; worker-src 'self' blob:; frame-src blob:" always;
    }
}

<!doctype html>
<html lang="de" data-ce-bereich="partner">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConfidaraExpress Partner</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- Startdokument der Partner-App (partner.confidaraexpress.de, FE-2 2026-11-22). Dieselbe Anwendung wie index.html;
         nginx liefert dieses Dokument für jede Seite des Partner-Hosts. Eigener Kopf: Manifest, Symbol und Name der
         Partner-App. data-ce-bereich="partner": schon das erste Bild steht auf dem Nachtgrund des Partnerportals
         (partner-nacht.css liegt im globalen Stylesheet). Im Build entfällt das Modulskript; danach trägt das Dokument
         genau die Einstiegs-Tags der gebauten index.html (vite.config.js) — kein zweiter JavaScript-Einstieg. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-v2.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-partner-v1.png" />
    <link rel="manifest" href="/partner.webmanifest" />
    <meta name="theme-color" content="#060B1C" />
    <meta name="apple-mobile-web-app-title" content="CE Partner" />
    <link rel="preload" href="/src/assets/fonts/instrumentsans-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/hostgrotesk-var.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
